name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Ruff
        run: pipx run ruff check extension kde tests && pipx run ruff format --check extension kde tests

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Pack extension
        run: |
          cd extension
          zip -r ../gnome-uebersicht.zip . -x '__pycache__/*'

      - uses: actions/upload-artifact@v4
        with:
          name: gnome-uebersicht
          path: gnome-uebersicht.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gnome-uebersicht.zip --generate-notes
    permissions:
      contents: write
